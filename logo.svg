<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 90 400 400" role="img" aria-label="Seed sprouting from soil">
  <defs>
    <!-- Soil -->
    <linearGradient id="soilTop" x1="0" y1="330" x2="0" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a6a45"/>
      <stop offset="1" stop-color="#6e4529"/>
    </linearGradient>
    <linearGradient id="soilSide" x1="0" y1="380" x2="0" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a3720"/>
      <stop offset="1" stop-color="#3b2313"/>
    </linearGradient>
    <linearGradient id="soilRim" x1="86" y1="0" x2="426" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c48f63" stop-opacity="0"/>
      <stop offset=".35" stop-color="#d8a679" stop-opacity=".9"/>
      <stop offset=".7" stop-color="#c48f63" stop-opacity=".5"/>
      <stop offset="1" stop-color="#c48f63" stop-opacity="0"/>
    </linearGradient>
    <!-- Seed -->
    <radialGradient id="seed" cx="230" cy="340" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4d29b"/>
      <stop offset=".55" stop-color="#d9a35f"/>
      <stop offset="1" stop-color="#9c6632"/>
    </radialGradient>
    <!-- Stem -->
    <linearGradient id="stem" x1="0" y1="360" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d7e8a2"/>
      <stop offset=".45" stop-color="#7cc35f"/>
      <stop offset="1" stop-color="#3f9a4d"/>
    </linearGradient>
    <!-- Leaves -->
    <linearGradient id="leafR" x1="268" y1="200" x2="410" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f8a47"/>
      <stop offset=".55" stop-color="#5fbf58"/>
      <stop offset="1" stop-color="#a6e07a"/>
    </linearGradient>
    <linearGradient id="leafL" x1="252" y1="212" x2="118" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a7a40"/>
      <stop offset=".6" stop-color="#4fae50"/>
      <stop offset="1" stop-color="#8fd36c"/>
    </linearGradient>
    <linearGradient id="leafShadeR" x1="0" y1="140" x2="0" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b3a1c" stop-opacity=".35"/>
    </linearGradient>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="256" cy="462" rx="170" ry="22" fill="#000" opacity=".22" filter="url(#blur8)"/>

  <!-- Soil disc: side, then top surface -->
  <path d="M86 380 V418 A170 48 0 0 0 426 418 V380 Z" fill="url(#soilSide)"/>
  <ellipse cx="256" cy="380" rx="170" ry="48" fill="url(#soilTop)"/>
  <ellipse cx="256" cy="380" rx="169" ry="47" fill="none" stroke="url(#soilRim)" stroke-width="2.5"/>

  <!-- Soil texture -->
  <g fill="#4e2f1a" opacity=".45">
    <circle cx="150" cy="392" r="3"/><circle cx="178" cy="404" r="2.2"/><circle cx="330" cy="400" r="2.8"/>
    <circle cx="362" cy="386" r="2"/><circle cx="300" cy="412" r="2"/><circle cx="210" cy="410" r="2.4"/>
    <circle cx="124" cy="378" r="1.8"/><circle cx="392" cy="372" r="2.2"/>
  </g>
  <g fill="#b98458" opacity=".55">
    <circle cx="160" cy="370" r="2"/><circle cx="344" cy="364" r="2.2"/><circle cx="276" cy="404" r="1.8"/>
  </g>

  <!-- Shadow cast by the seed onto the soil -->
  <ellipse cx="256" cy="390" rx="66" ry="12" fill="#2a170b" opacity=".45" filter="url(#blur4)"/>

  <!-- Stem -->
  <path d="M252 340 C244 296 274 252 262 198" fill="none" stroke="url(#stem)" stroke-width="15" stroke-linecap="round"/>
  <path d="M247 326 C241 292 266 256 257 210" fill="none" stroke="#f3fadc" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>

  <!-- Left leaf -->
  <path d="M258 206 C222 160 160 152 112 176 C140 228 208 238 258 206 Z" fill="url(#leafL)"/>
  <path d="M256 206 C214 196 168 186 124 178" fill="none" stroke="#c9f0a4" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <path d="M150 184 C176 168 214 170 236 186" fill="none" stroke="#e9ffd0" stroke-width="4" stroke-linecap="round" opacity=".35" filter="url(#blur2)"/>

  <!-- Right leaf -->
  <path d="M262 198 C296 128 370 104 424 126 C410 190 336 226 262 198 Z" fill="url(#leafR)"/>
  <path d="M262 198 C296 128 370 104 424 126 C410 190 336 226 262 198 Z" fill="url(#leafShadeR)"/>
  <path d="M266 196 C318 174 370 150 414 130" fill="none" stroke="#d8f7b3" stroke-width="3" stroke-linecap="round" opacity=".75"/>
  <path d="M300 152 C330 128 372 118 404 124" fill="none" stroke="#f1ffe0" stroke-width="5" stroke-linecap="round" opacity=".4" filter="url(#blur2)"/>

  <!-- Seed -->
  <g transform="rotate(-14 250 360)">
    <ellipse cx="250" cy="360" rx="58" ry="37" fill="url(#seed)"/>
    <path d="M198 356 C228 340 272 340 304 352" fill="none" stroke="#8a5528" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <ellipse cx="230" cy="342" rx="22" ry="9" fill="#fff6e2" opacity=".55" filter="url(#blur2)"/>
  </g>

  <!-- Soil lip in front of the seed, so it looks half buried -->
  <path d="M188 396 C214 384 294 382 320 396 C296 406 212 408 188 396 Z" fill="url(#soilTop)"/>
  <path d="M196 394 C220 386 290 385 312 394" fill="none" stroke="#c4906a" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <g fill="#5a3720"><circle cx="208" cy="398" r="3"/><circle cx="300" cy="399" r="2.6"/><circle cx="254" cy="402" r="2"/></g>
</svg>
